training:
  beta: 0.1                          # raise to 0.2-0.3 if margins stall (collapse)
  learning_rate: 5.0e-7
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  num_train_epochs: 1                # DPO overfits fast; early-stop within 1 epoch
  loss_type: sigmoid                 # try ipo if sigmoid collapses
  max_length: 2048
  max_prompt_length: 512

rejection_sampling:
  n_samples: 16
  temperature: 0.8
  top_p: 0.95
  max_tokens: 512

preference_pairs:
  strategy: partial                  # binary | partial | error_aware
  min_reward_gap: 0.2
  max_len_ratio: 1.5
